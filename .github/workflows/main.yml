
name: Build Algeria Payroll Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build application
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name AlgeriaPayroll --add-data "logo.png;." app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found"
          }
          & $iscc installer.iss

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: AlgeriaPayroll-Windows
          path: |
            dist/AlgeriaPayroll.exe
            installer_output/AlgeriaPayroll_Setup.exe
